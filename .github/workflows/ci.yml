name: CI

on:
  push:
    branches: [main]
  pull_request:

# 既定のトークンは読み取りだけにする（検証レポート S4）
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # アクションはタグではなくコミットSHAで固定する（タグは付け替えられるため）
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      # 突き合わせテストは本物の git と比べるので、バージョンを記録しておく
      - run: git --version
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npx biome ci .
      - name: Test (unit + golden)
        run: npm test
      - name: Build
        run: npx vite build
