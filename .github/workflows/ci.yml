name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npx biome ci .
      - name: Test (unit + golden)
        run: npm test
      - name: Build
        run: npx vite build
